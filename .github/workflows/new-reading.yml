# Turns one reading (audio + details) into a video, publishes it on YouTube and adds it to data/readings.json.
# The MP4 is always kept as a workflow artifact first, so a YouTube failure never loses the work.
# Triggers: the Google Form (repository_dispatch "new-reading", always publishes) or a manual run from the Actions tab.
name: Nova leitura

run-name: "${{ inputs.book || github.event.client_payload.book }} — ${{ inputs.chapter || github.event.client_payload.chapter || github.event.client_payload.part }} — ${{ inputs.narrator || github.event.client_payload.narrator }}"

on:
  repository_dispatch:
    types: [new-reading]
  workflow_dispatch:
    inputs:
      book:
        description: 'Livro (nome da NVI, ex.: Gênesis, 1 Tessalonicenses)'
        required: true
        type: string
      chapter:
        description: 'Capítulo (número), ou "introdução" / "encerramento"'
        required: true
        type: string
      narrator:
        description: 'Nome de quem leu'
        required: true
        type: string
      audio_url:
        description: 'Link do áudio (link direto, Google Drive "qualquer pessoa com o link" ou Dropbox)'
        required: true
        type: string
      publish:
        description: 'Publicar no YouTube e no catálogo (desmarcado: só gera o vídeo)'
        required: false
        type: boolean
        default: false
      id:
        description: 'ID da leitura (opcional; vazio = "manual-" + número da execução)'
        required: false
        type: string

permissions:
  contents: write # commit data/readings.json and store the app audio in GitHub Releases

# One reading at a time, so two runs never race on the catalog commit.
concurrency:
  group: new-reading
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outputs.published }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the artwork
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      # Inputs go through environment variables, never straight into the shell script.
      - name: Generate video
        id: generate
        env:
          READING_ID: ${{ inputs.id || github.event.client_payload.id || format('manual-{0}', github.run_id) }}
          BOOK: ${{ inputs.book || github.event.client_payload.book }}
          PART: ${{ github.event.client_payload.part }}
          CHAPTER: ${{ inputs.chapter || github.event.client_payload.chapter }}
          NARRATOR: ${{ inputs.narrator || github.event.client_payload.narrator }}
          # Manual runs use a link; form submissions use the uploaded Drive file.
          AUDIO: ${{ inputs.audio_url || format('drive:{0}', github.event.client_payload.driveFileId) }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          # Form payloads carry part=intro|closing instead of a chapter number.
          if [ -n "$PART" ] && [ "$PART" != "chapter" ]; then CHAPTER="$PART"; fi
          node src/index.js \
            --audio "$AUDIO" \
            --book "$BOOK" \
            --chapter "$CHAPTER" \
            --narrator "$NARRATOR" \
            --id "$READING_ID" \
            --out "$GITHUB_WORKSPACE/out/reading"

      - name: Save video as artifact
        if: steps.generate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leitura-${{ github.run_number }}
          path: |
            out/reading/output.mp4
            out/reading/output.mp3
            out/reading/artwork.png
            out/reading/thumbnail.jpg
            out/reading/reading.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish on YouTube
        id: publish
        if: (github.event_name == 'repository_dispatch' || inputs.publish) && steps.generate.outputs.skip != 'true'
        env:
          READING_ID: ${{ inputs.id || github.event.client_payload.id || format('manual-{0}', github.run_id) }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          YT_PLAYLIST_OT: ${{ vars.YT_PLAYLIST_OT }}
          YT_PLAYLIST_NT: ${{ vars.YT_PLAYLIST_NT }}
          GITHUB_TOKEN: ${{ github.token }} # app audio goes to GitHub Releases
        run: node src/publish.js --dir "$GITHUB_WORKSPACE/out/reading" --id "$READING_ID"

      - name: Commit catalog
        if: steps.publish.outputs.published == 'true'
        working-directory: .
        env:
          YOUTUBE_ID: ${{ steps.publish.outputs.youtube_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/readings.json
          git commit -m "Add reading to catalog (https://youtu.be/$YOUTUBE_ID)"
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "Push failed (attempt $attempt), retrying..."; sleep $((attempt * 5))
          done
          echo "::error::Could not save the catalog. The video is on YouTube: https://youtu.be/$YOUTUBE_ID — add it to data/readings.json by hand before re-running."
          exit 1

      # The app's "download for offline" needs the audio host to allow cross-origin reads (CORS).
      # This only reports what GitHub returns; it never fails the run.
      - name: Check audio download for the app (CORS)
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        working-directory: .
        env:
          AUDIO_URL: ${{ steps.publish.outputs.audio_url }}
        run: |
          headers=$(curl -sSIL -H "Origin: https://example.org" "$AUDIO_URL" | tr -d '\r')
          echo "$headers" | grep -iE '^(HTTP/|location:|access-control-allow-origin:|content-type:|accept-ranges:)'
          # The browser needs the CORS header on every hop (GitHub redirects to another host).
          hops=$(echo "$headers" | grep -ciE '^HTTP/')
          allowed=$(echo "$headers" | grep -ciE '^access-control-allow-origin:')
          echo "hops=$hops allowed=$allowed"
          if [ "$allowed" -ge "$hops" ]; then
            echo "### Áudio do app: download offline ✅ (CORS liberado)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Áudio do app: download offline ⚠️ (sem CORS; o app só toca online)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Rebuild the app so the new reading shows up there too.
  site:
    needs: video
    if: needs.video.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
